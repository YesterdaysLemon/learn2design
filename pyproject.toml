[project]
name = "learn2design-lab"
version = "0.1.0"
description = "Reproducible optimizer research for the Learn2Design 2026 challenge"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]
integration = [
  "dfbench==0.3.3",
  "h5py>=3.15,<4",
]
accelerator = [
  "jax[cuda12]==0.9.0.1; sys_platform == 'linux'",
]
accelerator-h100 = [
  "jax[cuda13]==0.9.0.1; sys_platform == 'linux'",
]
analysis = [
  "markdown==3.8.2",
  "matplotlib==3.10.5",
  "scipy==1.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
  "integration: tests that require the pinned scientific runtime",
]

[tool.uv]
package = false
