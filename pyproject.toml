[project]
name = "learn2design-lab"
version = "0.1.0"
description = "Reproducible optimizer research for the Learn2Design 2026 challenge"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]
integration = [
  "dfbench==0.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
