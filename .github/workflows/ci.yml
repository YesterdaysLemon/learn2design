name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest>=8.4,<9"
      - run: pytest -m "not integration"
      - run: python tools/build_submission.py
      - uses: actions/upload-artifact@v4
        with:
          name: learn2design-submission
          path: artifacts/generated/

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check
      - run: uv sync --frozen --group dev --group integration
      - run: uv run --group dev --group integration pytest -m integration

  analysis-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check
      - run: uv sync --frozen --group dev --group integration --group analysis
      - run: >-
          uv run --frozen --group dev --group integration --group analysis pytest
          tests/test_uifo_results_ingestion.py
          tests/test_restart_reference_analysis.py
          tests/test_restart_screen.py
